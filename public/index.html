<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nebula</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0e;color:#fff;font-family:system-ui,sans-serif}
    canvas{position:fixed;inset:0;pointer-events:none;z-index:0}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:52px;background:rgba(255,255,255,0.03);border-right:0.5px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:10}
    .sb-btn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:rgba(255,255,255,0.4);transition:background 0.15s,color 0.15s;border:none;background:none}
    .sb-btn:hover{background:rgba(255,255,255,0.07);color:#fff}
    .sb-btn.active{background:var(--accent);color:#fff}
    .sb-bottom{margin-top:auto}
    .main{position:fixed;left:52px;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
    .logo-text{font-size:72px;font-weight:700;letter-spacing:-2px;line-height:1;color:var(--accent);text-shadow:0 0 60px var(--accent-glow),0 0 120px var(--accent-glow2);transition:color 0.3s,text-shadow 0.3s}
    .logo-sub{font-size:14px;color:rgba(255,255,255,0.35);margin-top:8px;letter-spacing:0.5px;text-align:center}
    .search-wrap{width:460px;margin:32px 0 22px;position:relative}
    .search-wrap input{width:100%;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.12);border-radius:50px;padding:14px 90px 14px 46px;font-size:15px;color:#fff;outline:none;transition:border-color 0.2s,background 0.2s}
    .search-wrap input::placeholder{color:rgba(255,255,255,0.3)}
    .search-wrap input:focus{border-color:var(--accent);background:var(--accent-bg)}
    .search-icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:17px;color:rgba(255,255,255,0.3);pointer-events:none}
    .go-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:var(--accent);border:none;border-radius:50px;padding:8px 20px;font-size:13px;font-weight:500;color:#fff;cursor:pointer;transition:opacity 0.15s}
    .go-btn:hover{opacity:0.85}
    .links{display:flex;gap:10px}
    .link-card{background:rgba(255,255,255,0.05);border:0.5px solid rgba(255,255,255,0.09);border-radius:14px;padding:14px 18px;min-width:88px;text-align:center;cursor:pointer;transition:background 0.15s,border-color 0.15s;display:flex;flex-direction:column;align-items:center;gap:8px}
    .link-card:hover{background:rgba(255,255,255,0.09);border-color:var(--accent)}
    .link-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff}
    .link-label{font-size:12px;color:rgba(255,255,255,0.7);font-weight:500}
    .themes{display:flex;gap:8px;margin-top:26px}
    .theme-dot{width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.15s,border-color 0.15s}
    .theme-dot:hover{transform:scale(1.2)}
    .theme-dot.active{border-color:#fff}
    .status{font-size:12px;color:rgba(255,255,255,0.2);margin-top:20px;letter-spacing:1px;text-transform:uppercase}
    .frame-overlay{position:fixed;left:52px;right:0;top:0;bottom:0;z-index:20;display:none;flex-direction:column}
    .frame-topbar{background:#0d0d12;border-bottom:0.5px solid rgba(255,255,255,0.08);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
    .back-btn{background:none;border:none;color:rgba(255,255,255,0.5);font-size:18px;cursor:pointer;display:flex;align-items:center;padding:0}
    .back-btn:hover{color:#fff}
    .wdot{width:10px;height:10px;border-radius:50%}
    .frame-url-bar{flex:1;background:rgba(255,255,255,0.06);border:0.5px solid rgba(255,255,255,0.1);border-radius:50px;padding:6px 14px;font-size:12px;color:rgba(255,255,255,0.5)}
    iframe{flex:1;border:none;width:100%}
  </style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="sidebar">
  <div class="sb-btn active" onclick="showHome()"><i class="ti ti-home"></i></div>
  <div class="sb-btn"><i class="ti ti-device-gamepad-2"></i></div>
  <div class="sb-btn"><i class="ti ti-layout-grid"></i></div>
  <div class="sb-btn"><i class="ti ti-video"></i></div>
  <div class="sb-btn"><i class="ti ti-music"></i></div>
  <div class="sb-btn"><i class="ti ti-sparkles"></i></div>
  <div class="sb-btn sb-bottom"><i class="ti ti-settings"></i></div>
  <div class="sb-btn"><i class="ti ti-eye-off"></i></div>
</div>
<div class="main" id="mainView">
  <div class="logo-text">Nebula</div>
  <div class="logo-sub">explore the open web</div>
  <div class="search-wrap">
    <i class="ti ti-search search-icon"></i>
    <input id="urlInput" type="text" placeholder="Search for anything..." onkeydown="if(event.key==='Enter')loadSite()"/>
    <button class="go-btn" onclick="loadSite()">Go</button>
  </div>
  <div class="links">
    <div class="link-card" onclick="quickLoad('https://youtube.com')">
      <div class="link-icon" style="background:#ff0000"><i class="ti ti-brand-youtube"></i></div>
      <span class="link-label">Youtube</span>
    </div>
    <div class="link-card" onclick="quickLoad('https://github.com')">
      <div class="link-icon" style="background:#24292e"><i class="ti ti-brand-github"></i></div>
      <span class="link-label">Github</span>
    </div>
    <div class="link-card" onclick="quickLoad('https://discord.com')">
      <div class="link-icon" style="background:#5865f2"><i class="ti ti-brand-discord"></i></div>
      <span class="link-label">Discord</span>
    </div>
    <div class="link-card" onclick="quickLoad('https://reddit.com')">
      <div class="link-icon" style="background:#ff4500"><i class="ti ti-brand-reddit"></i></div>
      <span class="link-label">Reddit</span>
    </div>
    <div class="link-card" onclick="quickLoad('https://twitter.com')">
      <div class="link-icon" style="background:#000"><i class="ti ti-brand-x"></i></div>
      <span class="link-label">X</span>
    </div>
  </div>
  <div class="themes">
    <div class="theme-dot active" style="background:#7f77dd" onclick="setTheme('#7f77dd','rgba(127,119,221,0.5)','rgba(127,119,221,0.2)','rgba(127,119,221,0.06)',this)"></div>
    <div class="theme-dot" style="background:#d4537e" onclick="setTheme('#d4537e','rgba(212,83,126,0.5)','rgba(212,83,126,0.2)','rgba(212,83,126,0.06)',this)"></div>
    <div class="theme-dot" style="background:#1d9e75" onclick="setTheme('#1d9e75','rgba(29,158,117,0.5)','rgba(29,158,117,0.2)','rgba(29,158,117,0.06)',this)"></div>
    <div class="theme-dot" style="background:#ef9f27" onclick="setTheme('#ef9f27','rgba(239,159,39,0.5)','rgba(239,159,39,0.2)','rgba(239,159,39,0.06)',this)"></div>
    <div class="theme-dot" style="background:#378add" onclick="setTheme('#378add','rgba(55,138,221,0.5)','rgba(55,138,221,0.2)','rgba(55,138,221,0.06)',this)"></div>
  </div>
  <div class="status">Ready</div>
</div>
<div class="frame-overlay" id="frameView">
  <div class="frame-topbar">
    <button class="back-btn" onclick="showHome()"><i class="ti ti-arrow-left"></i></button>
    <div class="wdot" style="background:#e24b4a"></div>
    <div class="wdot" style="background:#ef9f27"></div>
    <div class="wdot" style="background:#639922"></div>
    <div class="frame-url-bar" id="frameUrlBar">about:blank</div>
  </div>
  <iframe id="frame"></iframe>
</div>
<script>
  const root = document.documentElement;
  root.style.setProperty('--accent','#7f77dd');
  root.style.setProperty('--accent-glow','rgba(127,119,221,0.5)');
  root.style.setProperty('--accent-glow2','rgba(127,119,221,0.2)');
  root.style.setProperty('--accent-bg','rgba(127,119,221,0.06)');

  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
  function initStars(){stars=[];for(let i=0;i<180;i++)stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.3+0.2,a:Math.random(),da:(Math.random()-0.5)*0.004})}
  function drawStars(){ctx.clearRect(0,0,canvas.width,canvas.height);stars.forEach(s=>{s.a+=s.da;if(s.a<=0||s.a>=1)s.da*=-1;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${s.a*0.7})`;ctx.fill()});requestAnimationFrame(drawStars)}
  resize();initStars();drawStars();
  window.addEventListener('resize',()=>{resize();initStars()});

  function setTheme(color,glow,glow2,bg,el){
    root.style.setProperty('--accent',color);
    root.style.setProperty('--accent-glow',glow);
    root.style.setProperty('--accent-glow2',glow2);
    root.style.setProperty('--accent-bg',bg);
    document.querySelectorAll('.theme-dot').forEach(d=>d.classList.remove('active'));
    el.classList.add('active');
  }
  function loadSite(){
    const url=document.getElementById('urlInput').value.trim();
    if(!url)return;
    const full=url.startsWith('http')?url:'https://'+url;
    openFrame(full);
  }
  function quickLoad(url){openFrame(url)}
  function openFrame(url){
    document.getElementById('frameUrlBar').textContent=url;
    document.getElementById('frame').src='/proxy?url='+encodeURIComponent(url);
    document.getElementById('mainView').style.display='none';
    document.getElementById('frameView').style.display='flex';
  }
  function showHome(){
    document.getElementById('frameView').style.display='none';
    document.getElementById('mainView').style.display='flex';
    document.getElementById('frame').src='about:blank';
  }
</script>
</body>
</html>
