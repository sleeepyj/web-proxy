<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Proxy</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
    input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; }
    iframe { width: 100%; height: 500px; margin-top: 20px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h2>Web Proxy</h2>
  <input id="urlInput" type="text" placeholder="https://example.com" />
  <button onclick="loadSite()">Go</button>
  <iframe id="frame"></iframe>
  <script>
    function loadSite() {
      const url = document.getElementById('urlInput').value;
      document.getElementById('frame').src = '/proxy?url=' + encodeURIComponent(url);
    }
  </script>
</body>
</html>
